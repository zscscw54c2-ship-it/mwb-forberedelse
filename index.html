<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forberedelse til midtukemøtet</title>
<script>
  // Sett valgt utseende før siden males, så det ikke blinker.
  try {
    var tema = localStorage.getItem("mwb-tema");
    if (tema === "lys") document.documentElement.setAttribute("data-tema", "light");
    else if (tema === "mork") document.documentElement.setAttribute("data-tema", "dark");
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#b8860b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Møteforberedelse">
</head>
<body>
<header class="topp">
  <button class="innst-knapp" id="innst-knapp" aria-label="Innstillinger" aria-expanded="false" aria-controls="innst-panel">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/>
    </svg>
  </button>
  <h1>Forberedelse til møtet</h1>
  <p class="dato" id="dato">Laster...</p>
  <div class="fremdrift" id="fremdrift" hidden></div>
  <div class="innst-panel" id="innst-panel">
    <section class="innst-del">
      <h2>Møtedag</h2>
      <select id="mote-dag" aria-label="Mitt midtukemøte er på">
        <option value="1">Mandag</option>
        <option value="2">Tirsdag</option>
        <option value="3">Onsdag</option>
        <option value="4">Torsdag</option>
        <option value="5">Fredag</option>
      </select>
      <p class="innst-hjelp">Appen går over til neste uke dagen etter møtet. Valget lagres bare på denne enheten.</p>
    </section>
    <section class="innst-del">
      <h2>Utseende</h2>
      <div class="tema-valg" role="group" aria-label="Utseende">
        <button type="button" data-tema="auto">Følg enheten</button>
        <button type="button" data-tema="lys">Lys</button>
        <button type="button" data-tema="mork">Mørk</button>
      </div>
    </section>
    <section class="innst-del">
      <h2>Fremdrift</h2>
      <button type="button" class="innst-nullstill" id="nullstill-knapp">Nullstill denne ukens fremdrift</button>
    </section>
    <section class="innst-del">
      <h2>Gå til uke</h2>
      <div id="arkiv-liste" class="uke-liste"></div>
    </section>
  </div>
</header>

<nav class="faner" id="faner"></nav>

<main id="innhold"></main>

<footer class="bunn">
  <p>Innhold generert med utgangspunkt i offisielt materiale fra
    <a id="kildelenke" href="#" target="_blank" rel="noopener">jw.org</a>.
    Se alltid kilden for det fullstendige programmet.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
